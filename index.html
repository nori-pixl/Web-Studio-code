<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebCode Studio</title>

<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
:root{
  --bg:#0b0d12;
  --panel:#151922;
  --panel2:#1c222e;
  --editor:#10131a;
  --line:#293140;
  --text:#d8dee9;
  --muted:#8490a6;
  --blue:#4f8cff;
  --cyan:#3fc8db;
  --green:#48d597;
  --red:#ff637d;
  --yellow:#e5c07b;
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100vh;
  display:grid;
  grid-template-rows:42px 1fr 24px;
}

.topbar{
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 14px;
  background:#12151d;
  border-bottom:1px solid var(--line);
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:700;
  white-space:nowrap;
}

.brand i{
  color:var(--blue);
}

.project{
  display:flex;
  align-items:center;
  gap:8px;
  padding-left:18px;
  color:var(--muted);
  border-left:1px solid var(--line);
  white-space:nowrap;
}

.toolbar{
  display:flex;
  gap:5px;
  margin-left:auto;
}

.icon{
  width:30px;
  height:30px;
  border:0;
  border-radius:5px;
  color:var(--muted);
  background:transparent;
}

.icon:hover,
.icon.active{
  color:var(--text);
  background:#252c3b;
}

.workspace{
  min-width:750px;
  min-height:0;
  display:grid;
  grid-template-columns:52px 260px minmax(280px,1fr) minmax(300px,42%);
}

.activity{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  padding-top:9px;
  background:#11141b;
  border-right:1px solid var(--line);
}

.activity button{
  position:relative;
  height:42px;
  font-size:18px;
}

.activity button.active::before{
  content:"";
  position:absolute;
  left:-11px;
  top:5px;
  height:32px;
  border-left:2px solid var(--blue);
}

.sidebar{
  min-width:0;
  overflow:hidden;
  background:var(--panel);
  border-right:1px solid var(--line);
  transition:
    width .25s ease,
    opacity .2s ease,
    transform .25s ease;
}

.sidebar.closed{
  width:0;
  opacity:0;
  transform:translateX(-20px);
  pointer-events:none;
}

.sidehead{
  height:42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
}

.actions{
  display:flex;
  gap:2px;
}

.tree{
  height:calc(100% - 42px);
  padding:2px 7px;
  overflow:auto;
}

.node{
  height:28px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 7px;
  border-radius:4px;
  white-space:nowrap;
  cursor:pointer;
  animation:nodeIn .18s ease;
}

.node:hover{
  background:#252c3b;
}

.node.selected{
  color:#fff;
  background:#28406d;
}

.node i{
  width:16px;
  color:var(--blue);
  text-align:center;
}

.node.folder i{
  color:var(--yellow);
}

.node-label{
  overflow:hidden;
  text-overflow:ellipsis;
}

.node-delete{
  display:none;
  margin-left:auto;
  color:var(--red)!important;
}

.node:hover .node-delete{
  display:block;
}

.folder-arrow{
  width:14px;
  color:var(--muted)!important;
  transition:transform .18s ease;
}

.folder-arrow.open{
  transform:rotate(90deg);
}

.editorarea{
  position:relative;
  min-width:0;
  min-height:0;
  background:var(--editor);
}

.tabs{
  height:38px;
  display:flex;
  overflow:auto;
  background:var(--panel);
  border-bottom:1px solid var(--line);
}

.tab{
  min-width:130px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px;
  color:var(--muted);
  border-right:1px solid var(--line);
  cursor:pointer;
}

.tab.active{
  color:var(--text);
  background:var(--editor);
  border-top:2px solid var(--blue);
}

.tab-close{
  margin-left:auto;
  color:var(--muted);
}

.tab-close:hover{
  color:var(--red);
}

.editor{
  position:absolute;
  inset:38px 0 0;
}

.panel{
  position:absolute;
  inset:0;
  z-index:2;
  display:none;
  padding:18px;
  overflow:auto;
  background:var(--editor);
}

.panel.active{
  display:block;
}

.debug-card,
.setting-card{
  margin-bottom:12px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--panel);
}

.debug-card strong{
  display:block;
  margin-bottom:8px;
  color:var(--text);
}

.debug-card pre{
  margin:0;
  color:var(--cyan);
  white-space:pre-wrap;
}

.setting{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}

select,
input[type="number"]{
  padding:6px 8px;
  color:var(--text);
  background:#242a36;
  border:1px solid var(--line);
  border-radius:4px;
}

.preview{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#fff;
  border-left:1px solid var(--line);
}

.preview-head{
  height:38px;
  display:flex;
  align-items:center;
  gap:4px;
  padding:0 9px;
  color:var(--muted);
  background:var(--panel);
  border-bottom:1px solid var(--line);
}

.mode{
  height:30px;
  padding:0 9px;
  color:var(--muted);
  background:transparent;
  border:0;
  border-bottom:2px solid transparent;
}

.mode:hover,
.mode.active{
  color:var(--cyan);
  border-bottom-color:var(--cyan);
}

#preview{
  display:block;
  width:100%;
  height:100%;
  flex:1;
  border:0;
  background:white;
}

.console{
  display:none;
  flex:1;
  overflow:auto;
  padding:12px;
  color:#c9d1d9;
  background:#0c0f14;
  font:12px ui-monospace,SFMono-Regular,Consolas,monospace;
}

.preview.console-mode #preview{
  display:none;
}

.preview.console-mode .console{
  display:block;
}

.console-line{
  margin-bottom:7px;
  white-space:pre-wrap;
}

.console-line.error{
  color:var(--red);
}

.console-line.event{
  color:var(--cyan);
}

.console-line.log{
  color:var(--green);
}

.status{
  display:flex;
  align-items:center;
  gap:20px;
  padding:0 12px;
  color:#c7d9ff;
  background:#182c49;
  font-size:11px;
}

.status-right{
  margin-left:auto;
}

.modal-bg{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  place-items:center;
  background:#0009;
}

.modal-bg.show{
  display:grid;
}

.modal{
  width:340px;
  padding:20px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--panel2);
  box-shadow:0 15px 50px #0008;
}

.modal h3{
  margin:0 0 13px;
}

.modal input{
  width:100%;
  padding:9px;
  color:var(--text);
  background:#11151d;
  border:1px solid var(--line);
  border-radius:4px;
}

.modal-buttons{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:16px;
}

.btn{
  padding:7px 14px;
  color:var(--text);
  background:#303949;
  border:0;
  border-radius:4px;
}

.btn.primary{
  color:white;
  background:var(--blue);
}

.toast{
  position:fixed;
  right:20px;
  bottom:35px;
  z-index:30;
  padding:10px 16px;
  border-radius:5px;
  color:var(--text);
  background:#263144;
  opacity:0;
  transform:translateY(10px);
  transition:.2s;
  pointer-events:none;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

@keyframes nodeIn{
  from{
    opacity:0;
    transform:translateX(-5px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}
</style>
</head>

<body>
<div class="app">

<header class="topbar">
  <div class="brand">
    <i class="fa-solid fa-code"></i>
    <span>WebCode Studio</span>
  </div>

  <div class="project">
    <i class="fa-regular fa-folder-open"></i>
    <span id="projectName">無題のプロジェクト</span>
  </div>

  <div class="toolbar">
    <button class="icon" id="openFolder" title="フォルダを開く">
      <i class="fa-solid fa-folder-open"></i>
    </button>

    <button class="icon" id="saveProject" title="保存">
      <i class="fa-solid fa-floppy-disk"></i>
    </button>

    <button class="icon" id="runProject" title="実行">
      <i class="fa-solid fa-play"></i>
    </button>
  </div>
</header>

<main class="workspace">

<nav class="activity">
  <button class="icon active" data-view="explorer" title="エクスプローラー">
    <i class="fa-regular fa-copy"></i>
  </button>

  <button class="icon" data-view="debug" title="デバッグ">
    <i class="fa-solid fa-bug"></i>
  </button>

  <button class="icon" data-view="settings" title="設定">
    <i class="fa-solid fa-gear"></i>
  </button>
</nav>

<aside class="sidebar" id="sidebar">
  <div class="sidehead">
    <span id="sideTitle">エクスプローラー</span>

    <span class="actions">
      <button class="icon" id="newFile" title="新しいファイル">
        <i class="fa-solid fa-file-circle-plus"></i>
      </button>

      <button class="icon" id="newFolder" title="新しいフォルダ">
        <i class="fa-solid fa-folder-plus"></i>
      </button>
    </span>
  </div>

  <div id="tree" class="tree"></div>
</aside>

<section class="editorarea">
  <div id="tabs" class="tabs"></div>
  <div id="editor" class="editor"></div>

  <section id="debugPanel" class="panel">
    <h3>
      <i class="fa-solid fa-bug"></i>
      デバッグ
    </h3>

    <div class="debug-card">
      <strong>
        <i class="fa-solid fa-file-code"></i>
        実行対象
      </strong>
      <div id="debugTarget">まだ実行されていません</div>
    </div>

    <div class="debug-card">
      <strong>
        <i class="fa-solid fa-terminal"></i>
        実行ログ
      </strong>
      <pre id="debugLog">ログはありません</pre>
    </div>

    <div class="debug-card">
      <strong>
        <i class="fa-solid fa-crosshairs"></i>
        HTMLイベント
      </strong>
      <pre id="eventLog">イベントはありません</pre>
    </div>

    <div class="debug-card">
      <strong>
        <i class="fa-solid fa-code"></i>
        選択されたDOM
      </strong>
      <pre id="domLog">DOM要素をクリックしてください</pre>
    </div>
  </section>

  <section id="settingsPanel" class="panel">
    <h3>
      <i class="fa-solid fa-gear"></i>
      設定
    </h3>

    <div class="setting-card">
      <label class="setting">
        <span>フォントサイズ</span>
        <input id="fontSize" type="number" min="10" max="32" value="14">
      </label>

      <label class="setting">
        <span>フォント</span>
        <select id="fontFamily">
          <option>Consolas</option>
          <option>Monaco</option>
          <option>monospace</option>
          <option>Source Code Pro</option>
        </select>
      </label>

      <label class="setting">
        <span>文字コード</span>
        <select id="encoding">
          <option>UTF-8</option>
          <option>Shift_JIS</option>
          <option>ISO-8859-1</option>
        </select>
      </label>
    </div>
  </section>
</section>

<section class="preview" id="previewPane">
  <div class="preview-head">
    <i class="fa-solid fa-display"></i>

    <button class="mode active" data-mode="live">
      <i class="fa-solid fa-bolt"></i>
      LIVE
    </button>

    <button class="mode" data-mode="console">
      <i class="fa-solid fa-terminal"></i>
      CONSOLE
    </button>

    <button class="mode" data-mode="debug">
      <i class="fa-solid fa-bug"></i>
      DEBUG
    </button>

    <button class="mode" data-mode="inspect">
      <i class="fa-solid fa-crosshairs"></i>
      INSPECT
    </button>

    <button class="icon" id="refreshPreview" title="更新">
      <i class="fa-solid fa-rotate"></i>
    </button>
  </div>

  <iframe
    id="preview"
    sandbox="allow-scripts allow-modals">
  </iframe>

  <div id="console" class="console"></div>
</section>

</main>

<footer class="status">
  <span>
    <i class="fa-solid fa-circle-check"></i>
    <span id="status">準備完了</span>
  </span>

  <span id="current">ファイル未選択</span>

  <span class="status-right" id="cursor">
    Ln 1, Col 1
  </span>
</footer>

</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modalTitle">新規作成</h3>

    <input id="modalInput" autocomplete="off">

    <div class="modal-buttons">
      <button class="btn" id="cancelModal">キャンセル</button>
      <button class="btn primary" id="acceptModal">作成</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.53.0/min/vs/loader.min.js"></script>

<script>
(() => {
  "use strict";

  const $ = selector => document.querySelector(selector);

  const models = {};
  const STORAGE_KEY = "webcode-studio-v4";

  let editor = null;
  let modalCallback = null;
  let currentMode = "live";
  let consoleLines = [];

  let state = {
    root: "root",
    active: null,
    tabs: [],
    nodes: {
      root: {
        id: "root",
        type: "folder",
        name: "プロジェクト",
        children: [],
        open: true
      }
    }
  };

  const icons = {
    html: "fa-brands fa-html5",
    htm: "fa-brands fa-html5",
    css: "fa-brands fa-css3-alt",
    js: "fa-brands fa-js",
    mjs: "fa-brands fa-js",
    jsx: "fa-brands fa-react",
    ts: "fa-solid fa-code",
    vue: "fa-brands fa-vuejs",
    json: "fa-solid fa-file-code",
    md: "fa-brands fa-markdown",
    default: "fa-regular fa-file-code"
  };

  function uid(){
    return "n" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function extension(name){
    return name.split(".").pop().toLowerCase();
  }

  function language(name){
    return {
      html:"html",
      htm:"html",
      css:"css",
      js:"javascript",
      mjs:"javascript",
      jsx:"javascript",
      ts:"typescript",
      vue:"html",
      json:"json",
      md:"markdown"
    }[extension(name)] || "plaintext";
  }

  function fileIcon(name){
    return icons[extension(name)] || icons.default;
  }

  function getChildren(id){
    const node = state.nodes[id];
    if(!node || !Array.isArray(node.children)) return [];

    return node.children
      .map(childId => state.nodes[childId])
      .filter(Boolean);
  }

  function showToast(message){
    const toast = $("#toast");

    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(() => {
      toast.classList.remove("show");
    }, 1800);
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      $("#status").textContent = "保存済み";
    }catch(error){
      showToast("保存に失敗しました");
    }
  }

  function restoreState(){
    try{
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

      if(saved && saved.nodes){
        state = saved;
      }
    }catch(error){
      console.warn("保存データを読み込めませんでした", error);
    }
  }

  function addNode(parent, name, content = "", type = "file"){
    const node = {
      id: uid(),
      type,
      name,
      parent,
      content,
      lang: language(name)
    };

    if(type === "folder"){
      node.children = [];
      node.open = false;
    }

    state.nodes[node.id] = node;

    if(!state.nodes[parent].children){
      state.nodes[parent].children = [];
    }

    state.nodes[parent].children.push(node.id);

    return node.id;
  }

  function openModal(title, defaultValue, callback){
    $("#modalTitle").textContent = title;
    $("#modalInput").value = defaultValue;
    $("#modal").classList.add("show");
    modalCallback = callback;

    setTimeout(() => {
      $("#modalInput").focus();
      $("#modalInput").select();
    }, 30);
  }

  function closeModal(){
    $("#modal").classList.remove("show");
    modalCallback = null;
  }

  function renderTree(){
    const tree = $("#tree");
    tree.innerHTML = "";

    function draw(parentId, depth){
      getChildren(parentId).forEach(node => {
        const row = document.createElement("div");

        row.className =
          "node " +
          node.type +
          (state.active === node.id ? " selected" : "");

        row.style.paddingLeft = (7 + depth * 15) + "px";
        row.dataset.id = node.id;

        if(node.type === "folder"){
          row.innerHTML = `
            <i class="folder-arrow ${node.open ? "open" : ""} fa-solid fa-chevron-right"></i>
            <i class="fa-solid fa-folder"></i>
            <span class="node-label"></span>
          `;

          row.querySelector(".node-label").textContent = node.name;

          row.addEventListener("click", event => {
            event.stopPropagation();
            node.open = !node.open;
            renderTree();
          });

          tree.appendChild(row);

          if(node.open){
            draw(node.id, depth + 1);
          }
        }else{
          row.innerHTML = `
            <i class="${fileIcon(node.name)}"></i>
            <span class="node-label"></span>
            <button class="icon node-delete" title="削除">
              <i class="fa-solid fa-trash"></i>
            </button>
          `;

          row.querySelector(".node-label").textContent = node.name;

          row.addEventListener("click", event => {
            if(event.target.closest(".node-delete")) return;

            event.stopPropagation();
            openFile(node.id);
          });

          row.querySelector(".node-delete").addEventListener("click", event => {
            event.stopPropagation();
            deleteNode(node.id);
          });

          tree.appendChild(row);
        }
      });
    }

    draw(state.root, 0);
  }

  function createEditorModel(node){
    if(models[node.id]) return models[node.id];

    if(window.monaco){
      models[node.id] = monaco.editor.createModel(
        node.content || "",
        node.lang
      );

      models[node.id].onDidChangeContent(() => {
        node.content = models[node.id].getValue();
        saveState();
        renderPreview();
      });

      return models[node.id];
    }

    return null;
  }

  function openFile(id){
    const node = state.nodes[id];
    if(!node || node.type !== "file") return;

    state.active = id;

    if(!state.tabs.includes(id)){
      state.tabs.push(id);
    }

    const model = createEditorModel(node);

    if(editor && model){
      editor.setModel(model);
      editor.focus();
    }

    $("#current").textContent = node.name;

    renderTabs();
    renderTree();
    saveState();
  }

  function renderTabs(){
    const tabs = $("#tabs");
    tabs.innerHTML = "";

    state.tabs.forEach(id => {
      const node = state.nodes[id];
      if(!node) return;

      const tab = document.createElement("div");

      tab.className =
        "tab " +
        (id === state.active ? "active" : "");

      tab.innerHTML = `
        <i class="${fileIcon(node.name)}"></i>
        <span class="node-label"></span>
        <button class="icon tab-close" title="閉じる">
          <i class="fa-solid fa-xmark"></i>
        </button>
      `;

      tab.querySelector(".node-label").textContent = node.name;

      tab.addEventListener("click", () => {
        openFile(id);
      });

      tab.querySelector(".tab-close").addEventListener("click", event => {
        event.stopPropagation();
        closeTab(id);
      });

      tabs.appendChild(tab);
    });
  }

  function closeTab(id){
    state.tabs = state.tabs.filter(tabId => tabId !== id);

    if(state.active === id){
      state.active = state.tabs[state.tabs.length - 1] || null;

      if(state.active){
        openFile(state.active);
      }else if(editor){
        editor.setModel(null);
        $("#current").textContent = "ファイル未選択";
      }
    }

    renderTabs();
    renderTree();
  }

  function deleteNode(id){
    const node = state.nodes[id];
    if(!node) return;

    if(!confirm(node.name + " を削除しますか？")){
      return;
    }

    function removeRecursively(nodeId){
      const target = state.nodes[nodeId];

      if(!target) return;

      if(target.children){
        [...target.children].forEach(removeRecursively);
      }

      if(models[nodeId]){
        models[nodeId].dispose();
        delete models[nodeId];
      }

      delete state.nodes[nodeId];
    }

    const parent = state.nodes[node.parent];

    if(parent){
      parent.children = parent.children.filter(childId => childId !== id);
    }

    removeRecursively(id);

    state.tabs = state.tabs.filter(tabId => tabId !== id);

    if(state.active === id){
      state.active = null;

      if(state.tabs.length){
        openFile(state.tabs[state.tabs.length - 1]);
      }else if(editor){
        editor.setModel(null);
        $("#current").textContent = "ファイル未選択";
      }
    }

    renderTree();
    renderTabs();
    saveState();
    showToast("削除しました");
  }

  function getProjectFile(name){
    return Object.values(state.nodes).find(node => {
      return node.type === "file" && node.name === name;
    });
  }

  function getEditorContent(node){
    if(!node) return "";

    if(models[node.id]){
      return models[node.id].getValue();
    }

    return node.content || "";
  }

  function escapeScript(text){
    return text.replace(/<\/script/gi, "<\\/script");
  }

  function buildPreviewDocument(){
    const htmlFile =
      state.active &&
      state.nodes[state.active] &&
      extension(state.nodes[state.active].name) === "html"
        ? state.nodes[state.active]
        : getProjectFile("index.html");

    const html = getEditorContent(htmlFile);
    const css = getEditorContent(getProjectFile("style.css"));
    const js = getEditorContent(getProjectFile("script.js"));

    const bridge = `
      <style>
        .webcode-hover{
          outline:2px solid #4f8cff !important;
          outline-offset:2px !important;
        }

        .webcode-selected{
          outline:3px solid #ff637d !important;
          outline-offset:3px !important;
        }
      </style>

      <script>
        (() => {
          const originalLog = console.log;
          const originalWarn = console.warn;
          const originalError = console.error;

          function send(type, text, extra = {}){
            parent.postMessage({
              source:"webcode-preview",
              type,
              text,
              ...extra
            }, "*");
          }

          function stringify(value){
            try{
              return typeof value === "string"
                ? value
                : JSON.stringify(value);
            }catch(error){
              return String(value);
            }
          }

          console.log = (...args) => {
            originalLog(...args);
            send("console", args.map(stringify).join(" "));
          };

          console.warn = (...args) => {
            originalWarn(...args);
            send("warn", args.map(stringify).join(" "));
          };

          console.error = (...args) => {
            originalError(...args);
            send("error", args.map(stringify).join(" "));
          };

          window.addEventListener("error", event => {
            send("error", event.message || "JavaScript error");
          });

          document.addEventListener("click", event => {
            const target = event.target;

            send("dom-event", "click", {
              tag: target.tagName,
              id: target.id || "",
              className: target.className || "",
              html: target.outerHTML || ""
            });
          }, true);

          document.addEventListener("input", event => {
            const target = event.target;

            send("dom-event", "input", {
              tag: target.tagName,
              id: target.id || "",
              className: target.className || "",
              html: target.outerHTML || ""
            });
          }, true);

          window.addEventListener("message", event => {
            if(!event.data) return;

            if(event.data.type === "inspect"){
              document.querySelectorAll(".webcode-selected")
                .forEach(element => {
                  element.classList.remove("webcode-selected");
                });

              const selector = event.data.selector;
              const element = selector
                ? document.querySelector(selector)
                : null;

              if(element){
                element.classList.add("webcode-selected");
              }
            }
          });
        })();
      <\/script>

      <script>
        try{
          ${escapeScript(js)}
        }catch(error){
          parent.postMessage({
            source:"webcode-preview",
            type:"error",
            text:error.message
          }, "*");
        }
      <\/script>
    `;

    let documentText = html || `
      <!doctype html>
      <html>
      <body>
        <h1>WebCode Studio</h1>
      </body>
      </html>
    `;

    if(documentText.includes("</head>")){
      documentText = documentText.replace(
        "</head>",
        "<style>" + css + "</style></head>"
      );
    }else{
      documentText = "<style>" + css + "</style>" + documentText;
    }

    if(documentText.includes("</body>")){
      documentText = documentText.replace("</body>", bridge + "</body>");
    }else{
      documentText += bridge;
    }

    return documentText;
  }

  function renderPreview(){
    const iframe = $("#preview");

    iframe.srcdoc = buildPreviewDocument();
    $("#status").textContent = "プレビューを更新しました";
  }

  function appendConsole(text, type = "log"){
    consoleLines.push({text, type});

    const consoleElement = $("#console");

    consoleElement.innerHTML = "";

    consoleLines.forEach(line => {
      const element = document.createElement("div");

      element.className = "console-line " + line.type;
      element.textContent = line.text;

      consoleElement.appendChild(element);
    });

    consoleElement.scrollTop = consoleElement.scrollHeight;
    $("#debugLog").textContent = consoleLines.map(line => line.text).join("\n");
  }

  function selectorForData(data){
    if(!data || !data.tag) return "";

    if(data.id){
      return "#" + CSS.escape(data.id);
    }

    if(data.className && typeof data.className === "string"){
      const firstClass = data.className.trim().split(/\s+/)[0];

      if(firstClass){
        return data.tag.toLowerCase() + "." + CSS.escape(firstClass);
      }
    }

    return data.tag.toLowerCase();
  }

  function setMode(mode){
    currentMode = mode;

    document.querySelectorAll(".mode").forEach(button => {
      button.classList.toggle("active", button.dataset.mode === mode);
    });

    const previewPane = $("#previewPane");

    previewPane.classList.toggle("console-mode", mode === "console");

    if(mode === "debug"){
      $("#debugPanel").classList.add("active");
    }else{
      $("#debugPanel").classList.remove("active");
    }

    if(mode === "live"){
      $("#debugPanel").classList.remove("active");
      renderPreview();
    }

    if(mode === "inspect"){
      appendConsole("DOMインスペクターモードを有効にしました", "event");
    }
  }

  function switchView(view, button){
    document.querySelectorAll("[data-view]").forEach(item => {
      item.classList.remove("active");
    });

    button.classList.add("active");

    const sidebar = $("#sidebar");
    const debugPanel = $("#debugPanel");
    const settingsPanel = $("#settingsPanel");

    if(view === "explorer"){
      const willClose = !sidebar.classList.contains("closed");
      sidebar.classList.toggle("closed", willClose);

      if(willClose){
        $("#sideTitle").textContent = "エクスプローラー";
      }

      debugPanel.classList.remove("active");
      settingsPanel.classList.remove("active");
      return;
    }

    sidebar.classList.add("closed");

    if(view === "debug"){
      debugPanel.classList.add("active");
      settingsPanel.classList.remove("active");
      $("#sideTitle").textContent = "デバッグ";
    }

    if(view === "settings"){
      settingsPanel.classList.add("active");
      debugPanel.classList.remove("active");
      $("#sideTitle").textContent = "設定";
    }
  }

  async function openFolder(){
    if(!window.showDirectoryPicker){
      showToast("このブラウザはフォルダ選択に対応していません");
      return;
    }

    try{
      const directory = await window.showDirectoryPicker();

      state = {
        root:"root",
        active:null,
        tabs:[],
        nodes:{
          root:{
            id:"root",
            type:"folder",
            name:directory.name,
            children:[],
            open:true
          }
        }
      };

      async function readDirectory(dir, parent){
        for await(const entry of dir.values()){
          if(entry.name.startsWith(".")) continue;

          if(entry.kind === "directory"){
            const folderId = addNode(parent, entry.name, "", "folder");
            state.nodes[folderId].open = true;
            await readDirectory(entry, folderId);
          }else{
            const file = await entry.getFile();
            const fileId = addNode(parent, entry.name, await file.text());

            if(!state.active){
              state.active = fileId;
            }
          }
        }
      }

      await readDirectory(directory, "root");

      $("#projectName").textContent = directory.name;

      renderTree();
      renderTabs();

      if(state.active){
        openFile(state.active);
      }

      saveState();
      showToast("フォルダを開きました");
    }catch(error){
      if(error.name !== "AbortError"){
        showToast("フォルダを開けませんでした");
      }
    }
  }

  function createDefaultProject(){
    if(getChildren(state.root).length > 0) return;

    const htmlId = addNode(
      "root",
      "index.html",
      `<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WebCode Studio</title>
</head>
<body>
  <h1 id="title">WebCode Studio</h1>
  <button id="hello">クリックしてください</button>
  <input id="name" placeholder="入力してください">
</body>
</html>`
    );

    addNode(
      "root",
      "style.css",
      `body {
  font-family: sans-serif;
  padding: 2rem;
}

button {
  padding: .7rem 1rem;
}`
    );

    addNode(
      "root",
      "script.js",
      `document.querySelector("#hello")?.addEventListener("click", () => {
  console.log("ボタンがクリックされました");
});`
    );

    state.nodes.root.open = true;
    openFile(htmlId);
  }

  function setupMonaco(){
    if(!window.require){
      showToast("エディターを読み込めませんでした");
      return;
    }

    require.config({
      paths:{
        vs:"https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.53.0/min/vs"
      }
    });

    require(["vs/editor/editor.main"], () => {
      editor = monaco.editor.create($("#editor"), {
        theme:"vs-dark",
        automaticLayout:true,
        fontSize:14,
        minimap:{enabled:false},
        wordWrap:"on",
        padding:{top:12}
      });

      editor.onDidChangeCursorPosition(event => {
        $("#cursor").textContent =
          "Ln " +
          event.position.lineNumber +
          ", Col " +
          event.position.column;
      });

      createDefaultProject();
      renderTree();
      renderTabs();
      renderPreview();
    });
  }

  document.addEventListener("click", event => {
    const viewButton = event.target.closest("[data-view]");

    if(viewButton){
      switchView(viewButton.dataset.view, viewButton);
    }

    const modeButton = event.target.closest("[data-mode]");

    if(modeButton){
      setMode(modeButton.dataset.mode);
    }
  });

  $("#newFile").addEventListener("click", () => {
    openModal("新しいファイル", "untitled.js", name => {
      const id = addNode("root", name);
      state.nodes.root.open = true;
      renderTree();
      openFile(id);
      saveState();
      showToast("ファイルを作成しました");
    });
  });

  $("#newFolder").addEventListener("click", () => {
    openModal("新しいフォルダ", "folder", name => {
      addNode("root", name, "", "folder");
      state.nodes.root.open = true;
      renderTree();
      saveState();
      showToast("フォルダを作成しました");
    });
  });

  $("#cancelModal").addEventListener("click", closeModal);

  $("#acceptModal").addEventListener("click", () => {
    const value = $("#modalInput").value.trim();

    if(!value){
      showToast("名前を入力してください");
      return;
    }

    const callback = modalCallback;

    closeModal();

    if(callback){
      callback(value);
    }
  });

  $("#modalInput").addEventListener("keydown", event => {
    if(event.key === "Enter"){
      $("#acceptModal").click();
    }

    if(event.key === "Escape"){
      closeModal();
    }
  });

  $("#runProject").addEventListener("click", () => {
    renderPreview();

    const node = state.nodes[state.active];

    if(node){
      $("#debugTarget").textContent = node.name;
      appendConsole("実行: " + node.name, "log");
    }

    setMode("live");
  });

  $("#refreshPreview").addEventListener("click", () => {
    renderPreview();
    appendConsole("プレビューを更新しました", "log");
  });

  $("#saveProject").addEventListener("click", () => {
    saveState();
    showToast("保存しました");
  });

  $("#openFolder").addEventListener("click", openFolder);

  $("#fontSize").addEventListener("change", event => {
    if(editor){
      editor.updateOptions({
        fontSize:Number(event.target.value)
      });
    }
  });

  $("#fontFamily").addEventListener("change", event => {
    if(editor){
      editor.updateOptions({
        fontFamily:event.target.value
      });
    }
  });

  window.addEventListener("message", event => {
    const data = event.data;

    if(!data || data.source !== "webcode-preview"){
      return;
    }

    if(data.type === "console"){
      appendConsole(data.text, "log");
    }

    if(data.type === "warn"){
      appendConsole(data.text, "event");
    }

    if(data.type === "error"){
      appendConsole(data.text, "error");
    }

    if(data.type === "dom-event"){
      const description =
        data.type +
        ": " +
        data.tag +
        (data.id ? "#" + data.id : "");

      $("#eventLog").textContent = description;

      $("#domLog").textContent =
        data.html || "DOM情報がありません";

      appendConsole(
        data.tag +
        " イベント: " +
        data.type,
        "event"
      );

      if(currentMode === "inspect"){
        const selector = selectorForData(data);

        $("#preview").contentWindow.postMessage({
          type:"inspect",
          selector
        }, "*");
      }
    }
  });

  restoreState();

  if(!state.nodes.root){
    state.nodes.root = {
      id:"root",
      type:"folder",
      name:"プロジェクト",
      children:[],
      open:true
    };
  }

  setupMonaco();

})();
</script>
</body>
</html>
