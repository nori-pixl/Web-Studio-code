<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebCode Studio</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
:root{
  --title:#3c3c3c;
  --sidebar:#252526;
  --editor:#1e1e1e;
  --tabs:#2d2d2d;
  --status:#007acc;
  --text:#cccccc;
  --muted:#858585;
  --line:#181818;
  --hover:#2a2d2e;
  --accent:#0a84ff;
  --green:#4ec9b0;
  --red:#f14c4c;
  --yellow:#c09553;
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  color:var(--text);
  background:var(--editor);
  font-family:"Segoe UI","Yu Gothic UI",sans-serif;
  font-size:13px;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}

#titlebar{
  height:32px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#eee;
  background:var(--title);
  border-bottom:1px solid var(--line);
  font-size:12px;
  user-select:none;
}

#main{
  min-height:0;
  flex:1;
  display:flex;
}

#activitybar{
  width:52px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  padding-top:8px;
  background:#181818;
  border-right:1px solid var(--line);
}

.activity-button{
  position:relative;
  width:38px;
  height:38px;
  color:#858585;
  background:transparent;
  border:0;
  border-radius:4px;
  font-size:18px;
}

.activity-button:hover,
.activity-button.active{
  color:#fff;
  background:#303030;
}

.activity-button.active::before{
  content:"";
  position:absolute;
  left:-7px;
  top:4px;
  height:30px;
  border-left:2px solid var(--accent);
}

#sidebar{
  width:240px;
  min-width:160px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--sidebar);
  border-right:1px solid var(--line);
  transition:width .2s ease,opacity .2s ease,transform .2s ease;
}

#sidebar.closed{
  width:0 !important;
  min-width:0 !important;
  opacity:0;
  transform:translateX(-20px);
  pointer-events:none;
}

#sidebar-header{
  height:42px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 9px 0 14px;
  color:#bbb;
  border-bottom:1px solid var(--line);
  font-size:11px;
  text-transform:uppercase;
  user-select:none;
}

.sidebar-actions{
  display:flex;
  gap:2px;
}

.icon-button{
  width:28px;
  height:28px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:0;
  color:#bbb;
  background:transparent;
  border:0;
  border-radius:4px;
}

.icon-button:hover{
  color:#fff;
  background:var(--hover);
}

#tree{
  min-height:0;
  flex:1;
  overflow:auto;
  padding:4px;
}

.tree-row{
  min-height:28px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:4px 6px;
  border-radius:3px;
  color:#ccc;
  cursor:pointer;
  white-space:nowrap;
  user-select:none;
}

.tree-row:hover{
  background:var(--hover);
}

.tree-row.active{
  color:#fff;
  background:#37373d;
}

.tree-row > i{
  width:15px;
  text-align:center;
  color:#75beff;
}

.tree-row.folder > .folder-icon{
  color:var(--yellow);
}

.tree-row .arrow{
  width:10px;
  color:#999;
  font-size:9px;
  transition:transform .15s ease;
}

.tree-row .arrow.open{
  transform:rotate(90deg);
}

.tree-name{
  min-width:0;
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
}

.delete-button{
  display:none;
  width:21px;
  height:21px;
  align-items:center;
  justify-content:center;
  padding:0;
  color:#aaa;
  background:transparent;
  border:0;
  border-radius:3px;
}

.tree-row:hover .delete-button{
  display:inline-flex;
}

.delete-button:hover{
  color:#fff;
  background:var(--red);
}

.resizer{
  width:4px;
  flex-shrink:0;
  cursor:col-resize;
  background:transparent;
}

.resizer:hover,
.resizer.dragging{
  background:var(--accent);
}

#editor-area{
  position:relative;
  min-width:0;
  min-height:0;
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--editor);
}

#tabs{
  height:36px;
  min-height:36px;
  display:flex;
  overflow:auto;
  background:var(--tabs);
  border-bottom:1px solid var(--line);
  user-select:none;
}

.tab{
  min-width:130px;
  max-width:220px;
  height:100%;
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 8px 0 13px;
  color:#999;
  border-right:1px solid var(--line);
  cursor:pointer;
  white-space:nowrap;
}

.tab.active{
  color:#fff;
  background:var(--editor);
  border-top:1px solid var(--accent);
}

.tab-name{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
}

.tab-close{
  margin-left:auto;
  width:20px;
  height:22px;
  padding:0;
  color:#999;
  background:transparent;
  border:0;
  border-radius:3px;
}

.tab-close:hover{
  color:#fff;
  background:#484848;
}

#editor-container{
  position:relative;
  min-width:0;
  min-height:0;
  flex:1;
  width:100%;
  height:100%;
  overflow:hidden;
}

#monaco{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#empty-state{
  position:absolute;
  inset:0;
  z-index:2;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:12px;
  color:var(--muted);
  background:var(--editor);
}

.panel{
  position:absolute;
  inset:36px 0 0;
  z-index:5;
  display:none;
  overflow:auto;
  padding:18px;
  background:var(--editor);
}

.panel.active{
  display:block;
}

.panel-card{
  margin-bottom:12px;
  padding:14px;
  color:#ccc;
  background:#252526;
  border:1px solid #3a3a3a;
  border-radius:5px;
}

.panel-card strong{
  display:block;
  margin-bottom:8px;
  color:#fff;
}

.panel-card pre{
  margin:0;
  color:var(--green);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.setting-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #3a3a3a;
}

.setting-row input,
.setting-row select{
  padding:5px 7px;
  color:#fff;
  background:#333;
  border:1px solid #555;
  border-radius:3px;
}

#preview-panel{
  width:40%;
  min-width:280px;
  min-height:0;
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  background:#fff;
  border-left:1px solid var(--line);
}

#preview-header{
  height:38px;
  min-height:38px;
  display:flex;
  align-items:center;
  gap:4px;
  padding:0 8px;
  color:#ccc;
  background:var(--tabs);
  border-bottom:1px solid var(--line);
  user-select:none;
}

.preview-title{
  margin-right:auto;
  font-size:12px;
}

.preview-button{
  height:28px;
  padding:0 8px;
  color:#999;
  background:transparent;
  border:0;
  border-bottom:2px solid transparent;
}

.preview-button:hover,
.preview-button.active{
  color:var(--green);
  border-bottom-color:var(--green);
}

#preview-frame{
  width:100%;
  min-height:0;
  flex:1;
  border:0;
  background:#fff;
}

#console{
  display:none;
  min-height:0;
  flex:1;
  overflow:auto;
  padding:12px;
  color:#ddd;
  background:#101318;
  font:12px Consolas,monospace;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

#preview-panel.console-mode #preview-frame{
  display:none;
}

#preview-panel.console-mode #console{
  display:block;
}

.console-line{
  margin-bottom:7px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.console-line.log{
  color:var(--green);
}

.console-line.error{
  color:#ff6b81;
}

.console-line.event{
  color:#4fc1e9;
}

#statusbar{
  height:23px;
  min-height:23px;
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 10px;
  color:#fff;
  background:var(--status);
  font-size:11px;
  user-select:none;
}

#status-right{
  display:flex;
  align-items:center;
  gap:15px;
  margin-left:auto;
}

#wrap-toggle{
  padding:2px 7px;
  border-radius:3px;
  cursor:pointer;
  background:rgba(255,255,255,.15);
}

#wrap-toggle.off{
  background:rgba(0,0,0,.25);
}

#modal{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  place-items:center;
  background:rgba(0,0,0,.55);
}

#modal.show{
  display:grid;
}

.modal-box{
  width:340px;
  padding:20px;
  color:#ddd;
  background:#252526;
  border:1px solid #444;
  border-radius:6px;
  box-shadow:0 18px 50px rgba(0,0,0,.5);
}

.modal-box h3{
  margin:0 0 12px;
  font-size:15px;
}

#modal-input{
  width:100%;
  padding:9px;
  color:#fff;
  background:#1e1e1e;
  border:1px solid #555;
  border-radius:4px;
  outline:none;
}

#modal-input:focus{
  border-color:var(--accent);
}

.modal-buttons{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:15px;
}

.modal-button{
  padding:7px 14px;
  color:#ddd;
  background:#3a3d41;
  border:1px solid #555;
  border-radius:4px;
}

.modal-button.primary{
  color:#fff;
  background:var(--accent);
  border-color:var(--accent);
}

#toast{
  position:fixed;
  right:20px;
  bottom:35px;
  z-index:30;
  padding:10px 15px;
  color:#fff;
  background:#303b4e;
  border-radius:5px;
  opacity:0;
  transform:translateY(8px);
  transition:.2s ease;
  pointer-events:none;
}

#toast.show{
  opacity:1;
  transform:translateY(0);
}
</style>
</head>

<body>
<div id="app">

  <div id="titlebar">
    <i class="fa-solid fa-code"></i>
    <span style="margin-left:7px">WebCode Studio</span>
  </div>

  <div id="main">

    <nav id="activitybar">
      <button class="activity-button active"
              data-view="explorer"
              title="エクスプローラー">
        <i class="fa-regular fa-copy"></i>
      </button>

      <button class="activity-button"
              data-view="debug"
              title="デバッグ">
        <i class="fa-solid fa-bug"></i>
      </button>

      <button class="activity-button"
              data-view="settings"
              title="設定">
        <i class="fa-solid fa-gear"></i>
      </button>
    </nav>

    <aside id="sidebar">
      <div id="sidebar-header">
        <span>エクスプローラー</span>

        <span class="sidebar-actions">
          <button class="icon-button"
                  id="open-folder-button"
                  title="フォルダを開く">
            <i class="fa-solid fa-folder-open"></i>
          </button>

          <button class="icon-button"
                  id="new-file-button"
                  title="新しいファイル">
            <i class="fa-solid fa-file-circle-plus"></i>
          </button>

          <button class="icon-button"
                  id="new-folder-button"
                  title="新しいフォルダ">
            <i class="fa-solid fa-folder-plus"></i>
          </button>
        </span>
      </div>

      <div id="tree"></div>
    </aside>

    <div class="resizer" id="left-resizer"></div>

    <section id="editor-area">
      <div id="tabs"></div>

      <div id="editor-container">
        <div id="monaco"></div>

        <div id="empty-state">
          <span>ファイルが開かれていません</span>

          <button class="modal-button" id="empty-new-file">
            <i class="fa-solid fa-file-circle-plus"></i>
            新しいファイル
          </button>
        </div>
      </div>

      <section class="panel" id="debug-panel">
        <h3>
          <i class="fa-solid fa-bug"></i>
          デバッグ
        </h3>

        <div class="panel-card">
          <strong>実行対象</strong>
          <div id="debug-target">まだ実行されていません</div>
        </div>

        <div class="panel-card">
          <strong>実行ログ</strong>
          <pre id="debug-output">ログはありません</pre>
        </div>

        <div class="panel-card">
          <strong>HTMLイベント</strong>
          <pre id="event-output">イベントはありません</pre>
        </div>

        <div class="panel-card">
          <strong>選択されたDOM</strong>
          <pre id="dom-output">DOM要素は選択されていません</pre>
        </div>
      </section>

      <section class="panel" id="settings-panel">
        <h3>
          <i class="fa-solid fa-gear"></i>
          設定
        </h3>

        <div class="panel-card">
          <label class="setting-row">
            <span>フォントサイズ</span>
            <input id="font-size"
                   type="number"
                   min="10"
                   max="32"
                   value="14">
          </label>

          <label class="setting-row">
            <span>フォント</span>
            <select id="font-family">
              <option>Consolas</option>
              <option>Monaco</option>
              <option>monospace</option>
              <option>Source Code Pro</option>
            </select>
          </label>
        </div>
      </section>
    </section>

    <div class="resizer" id="right-resizer"></div>

    <section id="preview-panel">

      <div id="preview-header">
        <span class="preview-title">
          <i class="fa-solid fa-display"></i>
          ライブプレビュー
        </span>

        <button class="preview-button active"
                data-mode="live"
                title="ライブプレビュー">
          <i class="fa-solid fa-bolt"></i>
          LIVE
        </button>

        <button class="preview-button"
                data-mode="console"
                title="コンソール">
          <i class="fa-solid fa-terminal"></i>
          CONSOLE
        </button>

        <button class="preview-button"
                data-mode="debug"
                title="デバッグ">
          <i class="fa-solid fa-bug"></i>
          DEBUG
        </button>

        <button class="preview-button"
                data-mode="inspect"
                title="DOMインスペクター">
          <i class="fa-solid fa-crosshairs"></i>
          INSPECT
        </button>

        <button class="preview-button"
                id="refresh-button"
                title="再読み込み">
          <i class="fa-solid fa-rotate"></i>
        </button>

        <button class="preview-button"
                id="open-preview-button"
                title="別ウィンドウで開く">
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </button>

        <button class="preview-button"
                id="run-preview-button"
                title="実行">
          <i class="fa-solid fa-play"></i>
        </button>
      </div>

      <iframe id="preview-frame"
              title="ライブプレビュー"
              sandbox="allow-scripts allow-modals">
      </iframe>

      <div id="console"></div>
    </section>
  </div>

  <footer id="statusbar">
    <span>
      <i class="fa-solid fa-circle-check"></i>
      <span id="status-text">準備完了</span>
    </span>

    <span id="current-file">ファイル未選択</span>

    <span id="status-right">
      <span id="cursor-position">Ln 1, Col 1</span>

      <span id="wrap-toggle">
        折り返し: ON
      </span>

      <span>UTF-8</span>
    </span>
  </footer>
</div>

<div id="modal">
  <div class="modal-box">
    <h3 id="modal-title">新規作成</h3>

    <input id="modal-input" autocomplete="off">

    <div class="modal-buttons">
      <button class="modal-button" id="modal-cancel">
        キャンセル
      </button>

      <button class="modal-button primary" id="modal-ok">
        作成
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.53.0/min/vs/loader.min.js"></script>

<script>
(() => {
  "use strict";

  const $ = selector => document.querySelector(selector);
  const STORAGE_KEY = "webcode-studio-complete-v1";
  const models = {};

  let editor = null;
  let modalCallback = null;
  let previewTimer = null;
  let wrapEnabled = true;
  let currentMode = "live";
  let consoleLines = [];

  const runtime = {
    rootHandle:null,
    handles:{}
  };

  let state = {
    root:"root",
    active:null,
    tabs:[],
    nodes:{
      root:{
        id:"root",
        type:"folder",
        name:"MY-PROJECT",
        parent:null,
        children:[],
        open:true
      }
    }
  };

  const VOID_TAGS = [
    "area","base","br","col","embed","hr","img",
    "input","link","meta","param","source","track","wbr"
  ];

  const fileIcons = {
    html:"fa-brands fa-html5",
    htm:"fa-brands fa-html5",
    css:"fa-brands fa-css3-alt",
    js:"fa-brands fa-js",
    mjs:"fa-brands fa-js",
    jsx:"fa-brands fa-react",
    ts:"fa-solid fa-code",
    tsx:"fa-brands fa-react",
    vue:"fa-brands fa-vuejs",
    json:"fa-solid fa-file-code",
    md:"fa-brands fa-markdown",
    default:"fa-regular fa-file-code"
  };

  function uid(){
    return "n" +
      Date.now().toString(36) +
      Math.random().toString(36).slice(2,8);
  }

  function extension(name){
    return String(name)
      .split(".")
      .pop()
      .toLowerCase();
  }

  function language(name){
    return {
      html:"html",
      htm:"html",
      css:"css",
      js:"javascript",
      mjs:"javascript",
      jsx:"javascript",
      ts:"typescript",
      tsx:"typescript",
      vue:"html",
      json:"json",
      md:"markdown"
    }[extension(name)] || "plaintext";
  }

  function fileIcon(name){
    return fileIcons[extension(name)] || fileIcons.default;
  }

  function getChildren(id){
    const node = state.nodes[id];

    if(!node || !Array.isArray(node.children)){
      return [];
    }

    return node.children
      .map(childId => state.nodes[childId])
      .filter(Boolean);
  }

  function getDirectoryHandle(id){
    if(id === state.root){
      return runtime.rootHandle;
    }

    return runtime.handles[id] || null;
  }

  function showToast(message){
    const element = $("#toast");

    element.textContent = message;
    element.classList.add("show");

    setTimeout(() => {
      element.classList.remove("show");
    }, 1800);
  }

  function saveState(){
    try{
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
      );
    }catch(error){
      console.warn(error);
    }
  }

  function restoreState(){
    try{
      const saved = JSON.parse(
        localStorage.getItem(STORAGE_KEY)
      );

      if(saved && saved.nodes){
        state = saved;

        state.tabs = Array.isArray(state.tabs)
          ? state.tabs
          : [];
      }
    }catch(error){
      console.warn("保存データを読み込めませんでした", error);
    }
  }

  function addNode(
    parentId,
    name,
    content = "",
    type = "file",
    handle = null
  ){
    const node = {
      id:uid(),
      type,
      name,
      parent:parentId,
      content,
      lang:language(name)
    };

    if(type === "folder"){
      node.children = [];
      node.open = false;
    }

    state.nodes[node.id] = node;

    if(!Array.isArray(state.nodes[parentId].children)){
      state.nodes[parentId].children = [];
    }

    state.nodes[parentId].children.push(node.id);

    if(handle){
      runtime.handles[node.id] = handle;
    }

    return node.id;
  }

  function renderTree(){
    const tree = $("#tree");
    tree.innerHTML = "";

    function draw(parentId, depth){
      getChildren(parentId).forEach(node => {
        const row = document.createElement("div");

        row.className =
          "tree-row " +
          node.type +
          (node.id === state.active ? " active" : "");

        row.style.paddingLeft =
          (7 + depth * 16) + "px";

        if(node.type === "folder"){
          row.innerHTML = `
            <i class="arrow fa-solid fa-chevron-right ${node.open ? "open" : ""}"></i>
            <i class="folder-icon fa-solid fa-folder"></i>
            <span class="tree-name"></span>
            <button class="delete-button" title="削除">
              <i class="fa-solid fa-trash"></i>
            </button>
          `;

          row.querySelector(".tree-name").textContent =
            node.name;

          row.addEventListener("click", event => {
            if(event.target.closest(".delete-button")){
              return;
            }

            node.open = !node.open;
            state.active = node.id;
            renderTree();
          });

          row.querySelector(".delete-button")
            .addEventListener("click", event => {
              event.stopPropagation();
              deleteNode(node.id);
            });

          tree.appendChild(row);

          if(node.open){
            draw(node.id, depth + 1);
          }

          return;
        }

        row.innerHTML = `
          <i class="${fileIcon(node.name)}"></i>
          <span class="tree-name"></span>
          <button class="delete-button" title="削除">
            <i class="fa-solid fa-trash"></i>
          </button>
        `;

        row.querySelector(".tree-name").textContent =
          node.name;

        row.addEventListener("click", event => {
          if(event.target.closest(".delete-button")){
            return;
          }

          event.preventDefault();
          event.stopPropagation();

          openFile(node.id);
        });

        row.querySelector(".delete-button")
          .addEventListener("click", event => {
            event.stopPropagation();
            deleteNode(node.id);
          });

        tree.appendChild(row);
      });
    }

    draw(state.root, 0);
  }

  function renderTabs(){
    const tabs = $("#tabs");
    tabs.innerHTML = "";

    state.tabs.forEach(id => {
      const node = state.nodes[id];

      if(!node || node.type !== "file"){
        return;
      }

      const tab = document.createElement("div");

      tab.className =
        "tab " +
        (id === state.active ? "active" : "");

      tab.innerHTML = `
        <i class="${fileIcon(node.name)}"></i>
        <span class="tab-name"></span>
        <button class="tab-close" title="閉じる">
          <i class="fa-solid fa-xmark"></i>
        </button>
      `;

      tab.querySelector(".tab-name").textContent =
        node.name;

      tab.addEventListener("click", event => {
        if(event.target.closest(".tab-close")){
          return;
        }

        openFile(id);
      });

      tab.querySelector(".tab-close")
        .addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
          closeTab(id);
        });

      tabs.appendChild(tab);
    });
  }

  function createModel(id){
    if(models[id]){
      return models[id];
    }

    const node = state.nodes[id];

    if(!node || !window.monaco){
      return null;
    }

    const model = monaco.editor.createModel(
      node.content || "",
      node.lang || "plaintext"
    );

    models[id] = model;

    model.onDidChangeContent(async () => {
      node.content = model.getValue();

      renderPreview();
      saveState();

      const handle = runtime.handles[id];

      if(handle){
        try{
          const writable = await handle.createWritable();

          try{
            await writable.write(node.content);
          }finally{
            await writable.close();
          }

          $("#status-text").textContent =
            "フォルダへ保存済み";
        }catch(error){
          console.error(error);
          $("#status-text").textContent =
            "保存エラー";
        }
      }else{
        $("#status-text").textContent =
          "編集中";
      }
    });

    return model;
  }

  function openFile(id){
    const node = state.nodes[id];

    if(!node || node.type !== "file"){
      return;
    }

    if(!state.tabs.includes(id)){
      state.tabs.push(id);
    }

    state.active = id;

    const model = createModel(id);

    if(!editor || !model){
      showToast("エディターを読み込めませんでした");
      return;
    }

    $("#empty-state").style.display = "none";

    editor.setModel(model);
    editor.focus();

    $("#current-file").textContent =
      node.name;

    renderTabs();
    renderTree();
    renderPreview();
    saveState();
  }

  function closeTab(id){
    state.tabs = state.tabs.filter(
      tabId => tabId !== id
    );

    if(state.active === id){
      state.active =
        state.tabs[state.tabs.length - 1] || null;

      if(state.active){
        openFile(state.active);
      }else{
        editor.setModel(null);
        $("#empty-state").style.display = "flex";
        $("#current-file").textContent =
          "ファイル未選択";
        renderPreview();
      }
    }

    renderTabs();
    renderTree();
    saveState();
  }

  function collectDescendants(id, result = []){
    const node = state.nodes[id];

    if(!node){
      return result;
    }

    result.push(id);

    if(Array.isArray(node.children)){
      node.children.forEach(childId => {
        collectDescendants(childId, result);
      });
    }

    return result;
  }

  async function deleteNode(id){
    const node = state.nodes[id];

    if(!node || id === state.root){
      return;
    }

    if(!confirm(node.name + " を削除しますか？")){
      return;
    }

    const parent = state.nodes[node.parent];

    try{
      const directory = getDirectoryHandle(node.parent);

      if(directory){
        await directory.removeEntry(
          node.name,
          { recursive:node.type === "folder" }
        );
      }
    }catch(error){
      console.error(error);
      showToast("削除できませんでした");
      return;
    }

    const ids = collectDescendants(id);

    ids.forEach(targetId => {
      if(models[targetId]){
        models[targetId].dispose();
        delete models[targetId];
      }

      delete runtime.handles[targetId];
      delete state.nodes[targetId];
    });

    if(parent && Array.isArray(parent.children)){
      parent.children = parent.children.filter(
        childId => childId !== id
      );
    }

    state.tabs = state.tabs.filter(
      tabId => !ids.includes(tabId)
    );

    if(ids.includes(state.active)){
      state.active =
        state.tabs[state.tabs.length - 1] || null;

      if(state.active){
        openFile(state.active);
      }else{
        editor.setModel(null);
        $("#empty-state").style.display = "flex";
        $("#current-file").textContent =
          "ファイル未選択";
      }
    }

    renderTree();
    renderTabs();
    renderPreview();
    saveState();
    showToast("削除しました");
  }

  function selectedParent(){

  async function createFile(name){
    if(!name || /[\/\\]/.test(name)){
      showToast("ファイル名が不正です");
      return;
    }

    const parentId = selectedParent();
    const parent = state.nodes[parentId];

    if(!parent){
      return;
    }

    if(getChildren(parentId).some(node => node.name === name)){
      showToast("同じ名前が存在します");
      return;
    }

    const directory = getDirectoryHandle(parentId);
    let handle = null;

    if(directory){
      handle = await directory.getFileHandle(
        name,
        { create:true }
      );
    }

    const id = addNode(
      parentId,
      name,
      "",
      "file",
      handle
    );

    parent.open = true;

    renderTree();
    openFile(id);
    saveState();
    showToast("ファイルを作成しました");
  }

  async function createFolder(name){
    if(!name || /[\/\\]/.test(name)){
      showToast("フォルダ名が不正です");
      return;
    }

    const parentId = selectedParent();
    const parent = state.nodes[parentId];

    if(!parent){
      return;
    }

    if(getChildren(parentId).some(node => node.name === name)){
      showToast("同じ名前が存在します");
      return;
    }

    const directory = getDirectoryHandle(parentId);
    let handle = null;

    if(directory){
      handle = await directory.getDirectoryHandle(
        name,
        { create:true }
      );
    }

    const id = addNode(
      parentId,
      name,
      "",
      "folder",
      handle
    );

    parent.open = true;
    state.nodes[id].open = true;

    renderTree();
    saveState();
    showToast("フォルダを作成しました");
  }

  function getProjectFile(name){

  function contentOf(node){
    if(!node){
      return "";
    }

    return models[node.id]

  function previewSource(){
    const active = state.nodes[state.active];
    const index = getProjectFile("index.html");
    const css = getProjectFile("style.css");
    const js = getProjectFile("script.js");

    if(!active){
      return {
        html:contentOf(index),
        css:contentOf(css),
        js:contentOf(js)
      };
    }

    const ext = extension(active.name);

    if(ext === "html" || ext === "htm"){
      return {
        html:contentOf(active),
        css:contentOf(css),
        js:contentOf(js)
      };
    }

    if(ext === "css"){
      return {
        html:contentOf(index),
        css:contentOf(active),
        js:contentOf(js)
      };
    }

    if(["js","mjs","jsx","ts","tsx"].includes(ext)){
      return {
        html:contentOf(index),
        css:contentOf(css),
        js:contentOf(active)
      };
    }

    return {
      html:contentOf(index),
      css:contentOf(css),
      js:contentOf(js)
    };
  }

  function setupHtmlCompletion(){
    if(!window.monaco){
      return;
    }

    monaco.languages.registerCompletionItemProvider(
      "html",
      {
        triggerCharacters:["<"," "],

        provideCompletionItems(model, position){
          const line =
            model.getLineContent(position.lineNumber);

          const before =
            line.slice(0, position.column - 1);

          const word =
            model.getWordUntilPosition(position);

          const range = {
            startLineNumber:position.lineNumber,
            endLineNumber:position.lineNumber,
            startColumn:word.startColumn,
            endColumn:word.endColumn
          };

          const suggestions = [];

          if(
            before.endsWith("<") ||
            /<[\w-]*$/.test(before)
          ){
            const tags = [
              "html","head","body","title","meta","link",
              "style","script","header","nav","main",
              "section","article","aside","footer","div",
              "span","h1","h2","h3","h4","h5","h6",
              "p","a","img","button","form","label",
              "input","textarea","select","option","ul",
              "ol","li","table","thead","tbody","tr",
              "th","td","br","hr"
            ];

            tags.forEach(tag => {
              const voidTag = VOID_TAGS.includes(tag);

              suggestions.push({
                label:tag,
                kind:monaco.languages.CompletionItemKind.Keyword,
                detail:"HTMLタグ",
                insertText:voidTag
                  ? tag + ">"
                  : tag + ">$0</" + tag + ">",
                insertTextRules:voidTag
                  ? undefined
                  : monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                range
              });
            });
          }

          /*
           * <a h の場合 href を先頭に追加。
           */
          if(/<a\s+h[\w-]*$/i.test(before)){
            suggestions.unshift({
              label:"href",
              kind:monaco.languages.CompletionItemKind.Property,
              detail:"リンク先",
              insertText:'href="$1"',
              insertTextRules:
                monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
              range
            });
          }

          if(/<[\w-]+\s+[\w-]*$/.test(before)){
            [
              "id","class","style","title","href","src",
              "alt","target","rel","type","name","value",
              "placeholder","role","aria-label","aria-hidden",
              "data-*","disabled","required","checked","selected"
            ].forEach(attribute => {
              suggestions.push({
                label:attribute,
                kind:monaco.languages.CompletionItemKind.Property,
                detail:"HTML属性",
                insertText:attribute === "data-*"
                  ? 'data-$1="$2"'
                  : attribute + '="$1"',
                insertTextRules:
                  monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                range
              });
            });
          }

          return {
            suggestions
          };
        }
      }
    );
  }

  function setupAutoCloseTag(){
    if(!editor){
      return;
    }

    editor.onDidType(text => {
      if(text !== ">"){
        return;
      }

      const model = editor.getModel();

      if(!model || model.getLanguageId() !== "html"){
        return;
      }

      const position = editor.getPosition();
      const line =
        model.getLineContent(position.lineNumber);

      const before =
        line.slice(0, position.column - 1);

      const after =
        line.slice(position.column - 1);

      const match = before.match(
        /<([a-zA-Z][a-zA-Z0-9-]*)((?:\s[^<>]*)?)>$/
      );

      if(!match){
        return;
      }

      const tag = match[1];
      const attributes = match[2] || "";

      if(
        VOID_TAGS.includes(tag.toLowerCase()) ||
        /\/\s*$/.test(attributes)
      ){
        return;
      }

      const closeTag = "</" + tag + ">";

      if(
        new RegExp("^" + closeTag, "i").test(after)
      ){
        return;
      }

      editor.executeEdits(
        "auto-close-tag",
        [{
          range:new monaco.Range(
            position.lineNumber,
            position.column,
            position.lineNumber,
            position.column
          ),
          text:closeTag,
          forceMoveMarkers:true
        }]
      );

      editor.setPosition(position);
    });
  }

  function setupResizers(){
    const main = $("#main");
    const sidebar = $("#sidebar");
    const preview = $("#preview-panel");
    const left = $("#left-resizer");
    const right = $("#right-resizer");

    let draggingLeft = false;
    let draggingRight = false;

    left.addEventListener("mousedown", () => {
      draggingLeft = true;
      left.classList.add("dragging");
    });

    right.addEventListener("mousedown", () => {
      draggingRight = true;
      right.classList.add("dragging");
    });

    window.addEventListener("mousemove", event => {
      if(!draggingLeft && !draggingRight){
        return;
      }

      const rect = main.getBoundingClientRect();

      if(draggingLeft){
        const width = Math.max(
          160,
          Math.min(
            380,
            event.clientX - rect.left - 52
          )
        );

        sidebar.style.width = width + "px";
      }

      if(draggingRight){
        const width = Math.max(
          280,
          Math.min(
            rect.width * .65,
            rect.right - event.clientX
          )
        );

        preview.style.width = width + "px";
      }

      if(editor){
        editor.layout();
      }
    });

    window.addEventListener("mouseup", () => {
      draggingLeft = false;
      draggingRight = false;

      left.classList.remove("dragging");
      right.classList.remove("dragging");

      if(editor){
        editor.layout();
      }
    });
  }

  async function openFolder(){
    if(!window.showDirectoryPicker){
      showToast(
        "ChromeまたはEdgeのHTTPS/localhostで開いてください"
      );
      return;
    }

    try{
      const directory =
        await window.showDirectoryPicker({
          mode:"readwrite"
        });

      const permission =
        await directory.requestPermission({
          mode:"readwrite"
        });

      if(permission !== "granted"){
        showToast("書き込み権限が必要です");
        return;
      }

      runtime.rootHandle = directory;
      runtime.handles = {
        root:directory
      };

      state = {
        root:"root",
        active:null,
        tabs:[],
        nodes:{
          root:{
            id:"root",
            type:"folder",
            name:directory.name,
            parent:null,
            children:[],
            open:true
          }
        }
      };

      Object.keys(models).forEach(id => {
        models[id].dispose();
        delete models[id];
      });

      async function readDirectory(handle, parentId){
        for await(const entry of handle.values()){
          if(entry.name.startsWith(".")){
            continue;
          }

          if(entry.kind === "directory"){
            const folderId = addNode(
              parentId,
              entry.name,
              "",
              "folder",
              entry
            );

            state.nodes[folderId].open = true;

            await readDirectory(entry, folderId);
          }else{
            const file = await entry.getFile();

            const fileId = addNode(
              parentId,
              entry.name,
              await file.text(),
              "file",
              entry
            );

            if(!state.active){
              state.active = fileId;
            }
          }
        }
      }

      await readDirectory(directory, state.root);

      renderTree();
      renderTabs();

      if(state.active){
        openFile(state.active);
      }else{
        editor.setModel(null);
        $("#empty-state").style.display = "flex";
      }

      saveState();
      showToast("フォルダを開きました");
    }catch(error){
      if(error.name !== "AbortError"){
        console.error(error);
        showToast("フォルダを開けませんでした");
      }
    }
  }

      "style.css",
      `body {
  font-family: sans-serif;
  padding: 2rem;
}

button {
  padding: .7rem 1rem;
}`
    );

    addNode(
      state.root,
      "script.js",
      `document.querySelector("#hello")?.addEventListener("click", () => {
  console.log("ボタンがクリックされました");
});`
    );

    state.nodes.root.open = true;
    openFile(htmlId);
  }

  function setupMonaco(){
    if(!window.require){
      showToast("Monaco Editorを読み込めませんでした");
      return;
    }

    require.config({
      paths:{
        vs:"https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.53.0/min/vs"
      }
    });

    require(
      ["vs/editor/editor.main"],
      () => {
        editor = monaco.editor.create(
          $("#monaco"),
          {
            theme:"vs-dark",
            automaticLayout:true,

            /*
             * Monaco公式の折り返し設定。
             * wordWrapColumn:0 は表示幅で折り返す設定。
             */
            wordWrap:"on",
            wrappingStrategy:"advanced",
            wrappingIndent:"same",
            wordWrapColumn:0,

            scrollBeyondLastLine:false,
            minimap:{
              enabled:false
            },
            fontSize:14,
            lineNumbers:"on",
            padding:{
              top:8
            },
            quickSuggestions:{
              other:true,
              comments:true,
              strings:true
            },
            suggestOnTriggerCharacters:true
          }
        );

        setupHtmlCompletion();
        setupAutoCloseTag();
        setupResizers();

        const observer =
          new ResizeObserver(() => {
            if(editor){
              editor.layout();
            }
          });

        observer.observe($("#monaco"));

        editor.onDidChangeCursorPosition(event => {
          $("#cursor-position").textContent =
            "Ln " +
            event.position.lineNumber +
            ", Col " +
            event.position.column;
        });

        restoreState();

        if(!state.nodes[state.root]){
          state = {
            root:"root",
            active:null,
            tabs:[],
            nodes:{
              root:{
                id:"root",
                type:"folder",
                name:"MY-PROJECT",
                parent:null,
                children:[],
                open:true
              }
            }
          };
        }

        createDefaultProject();
        renderTree();
        renderTabs();

        if(state.active){
          openFile(state.active);
        }

        renderPreview();
      },
      error => {
        console.error(error);
        showToast("Monaco Editorの読み込みに失敗しました");
      }
    );
  }

  /*
   * 左のアクティビティバー
   */
  document.addEventListener("click", event => {
    const viewButton =
      event.target.closest("[data-view]");

    if(viewButton){
      switchView(
        viewButton.dataset.view,
        viewButton
      );
    }

    const modeButton =
      event.target.closest("[data-mode]");

    if(modeButton){
      setMode(modeButton.dataset.mode);
    }
  });

  /*
   * 新規ファイル
   */
  $("#new-file-button").addEventListener(
    "click",
    () => {
      openModal(
        "新しいファイル",
        "untitled.html",
        async name => {
          try{
            await createFile(name.trim());
          }catch(error){
            console.error(error);
            showToast("ファイルを作成できませんでした");
          }
        }
      );
    }
  );

  /*
   * 新規フォルダ
   */
  $("#new-folder-button").addEventListener(
    "click",
    () => {
      openModal(
        "新しいフォルダ",
        "new-folder",
        async name => {
          try{
            await createFolder(name.trim());
          }catch(error){
            console.error(error);
            showToast("フォルダを作成できませんでした");
          }
        }
      );
    }
  );

  $("#empty-new-file").addEventListener(
    "click",
    () => {
      $("#new-file-button").click();
    }
  );

  $("#open-folder-button").addEventListener(
    "click",
    openFolder
  );

  $("#modal-cancel").addEventListener(
    "click",
    closeModal
  );

  $("#modal-ok").addEventListener(
    "click",
    () => {
      const value =
        $("#modal-input").value.trim();

      if(!value){
        showToast("名前を入力してください");
        return;
      }

      const callback = modalCallback;

      closeModal();

      if(callback){
        callback(value);
      }
    }
  );

  $("#modal-input").addEventListener(
    "keydown",
    event => {
      if(event.key === "Enter"){
        $("#modal-ok").click();
      }

      if(event.key === "Escape"){
        closeModal();
      }
    }
  );

  /*
   * 三角ボタン:
   * ユーザー操作中に window.open() を実行するため、
   * ポップアップブロックされにくい構成。
   */
  $("#run-preview-button").addEventListener(
    "click",
    () => {
      const previewWindow =
        window.open(
          "about:blank",
          "_blank",
          "width=1100,height=760"
        );

      if(!previewWindow){
        showToast("ポップアップがブロックされています");
        return;
      }

      previewWindow.document.open();
      previewWindow.document.write(
        buildPreviewDocument()
      );
      previewWindow.document.close();

      const active =
        state.nodes[state.active];

      $("#debug-target").textContent =
        active ? active.name : "現在のファイル";

      appendConsole(
        "プレビューを別ウィンドウで実行しました",
        "log"
      );

      showToast("別ウィンドウで実行しました");
    }
  );

  $("#open-preview-button").addEventListener(
    "click",
    () => {
      const previewWindow =
        window.open(
          "about:blank",
          "_blank",
          "width=1100,height=760"
        );

      if(!previewWindow){
        showToast("ポップアップがブロックされています");
        return;
      }

      previewWindow.document.open();
      previewWindow.document.write(
        buildPreviewDocument()
      );
      previewWindow.document.close();
    }
  );

  $("#refresh-button").addEventListener(
    "click",
    () => {
      renderPreview();

      appendConsole(
        "プレビューを再読み込みしました",
        "log"
      );
    }
  );

  $("#wrap-toggle").addEventListener(
    "click",
    () => {
      wrapEnabled = !wrapEnabled;

      editor.updateOptions({
        wordWrap:wrapEnabled ? "on" : "off",
        wrappingStrategy:"advanced",
        wordWrapColumn:0
      });

      $("#wrap-toggle").textContent =
        wrapEnabled
          ? "折り返し: ON"
          : "折り返し: OFF";

      $("#wrap-toggle").classList.toggle(
        "off",
        !wrapEnabled
      );
    }
  );

  $("#font-size").addEventListener(
    "change",
    event => {
      if(editor){
        editor.updateOptions({
          fontSize:Number(event.target.value)
        });
      }
    }
  );

  $("#font-family").addEventListener(
    "change",
    event => {
      if(editor){
        editor.updateOptions({
          fontFamily:event.target.value
        });
      }
    }
  );

  window.addEventListener("message", event => {
    const data = event.data;

    if(!data || data.source !== "webcode-preview"){
      return;
    }

    if(data.type === "console"){
      appendConsole(data.text, "log");
    }

    if(data.type === "warn"){
      appendConsole(data.text, "event");
    }

    if(data.type === "error"){
      appendConsole(data.text, "error");
    }

    if(data.type === "dom-event"){
      $("#event-output").textContent =
        data.text + ": " + data.tag;

      $("#dom-output").textContent =
        data.html || "DOM情報がありません";

      appendConsole(
        data.tag + " イベント: " + data.text,
        "event"
      );

      if(currentMode === "inspect"){
        $("#preview-frame").contentWindow.postMessage(
          {
            type:"inspect",
            selector:selectorForEvent(data)
          },
          "*"
        );
      }
    }
  });

  setupMonaco();
})();
</script>
</body>
</html>
